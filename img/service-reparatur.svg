<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Ілюстрація «Kleinreparaturen»: кран, що крапає, і гайковий ключ. Кольори — як у css/style.css -->
  <rect width="800" height="600" fill="#eaf0f6"/>
  <circle cx="400" cy="300" r="230" fill="#d6e1ec"/>

  <!-- Плитка на стіні -->
  <g fill="none" stroke="#c3d1df" stroke-width="4">
    <path d="M190 170h420M190 250h420M190 330h420M300 130v280M410 130v280M520 130v280"/>
  </g>

  <!-- Кран -->
  <rect x="200" y="190" width="56" height="120" rx="10" fill="#3d5f8a"/>
  <rect x="240" y="226" width="210" height="46" rx="12" fill="#1f3a5f"/>
  <rect x="408" y="226" width="46" height="96" rx="12" fill="#1f3a5f"/>
  <rect x="404" y="312" width="54" height="16" rx="6" fill="#3d5f8a"/>
  <!-- Ручка крана -->
  <rect x="318" y="196" width="18" height="34" fill="#e07a1f"/>
  <rect x="288" y="180" width="78" height="22" rx="10" fill="#e07a1f"/>

  <!-- Краплі -->
  <path d="M431 348c-10 16-16 24-16 32a16 16 0 0 0 32 0c0-8-6-16-16-32z" fill="#5b9bd5"/>
  <path d="M431 410c-7 11-11 17-11 22a11 11 0 0 0 22 0c0-5-4-11-11-22z" fill="#5b9bd5" opacity="0.7"/>

  <!-- Гайковий ключ -->
  <mask id="wrench-cut">
    <rect x="-80" y="-80" width="360" height="160" fill="#fff"/>
    <rect x="-70" y="-17" width="52" height="34" fill="#000"/>
    <circle cx="214" cy="0" r="8" fill="#000"/>
  </mask>
  <g transform="translate(470 440) rotate(-30)">
    <g mask="url(#wrench-cut)" fill="#e07a1f">
      <circle cx="0" cy="0" r="48"/>
      <rect x="20" y="-17" width="214" height="34" rx="17"/>
    </g>
  </g>
</svg>
