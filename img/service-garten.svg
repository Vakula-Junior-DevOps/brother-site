<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Ілюстрація «Gartenpflege»: кущ, сонце, газон і садові ножиці -->
  <rect width="800" height="600" fill="#eaf0f6"/>
  <circle cx="400" cy="300" r="230" fill="#d6e1ec"/>
  <!-- Сонце -->
  <circle cx="560" cy="160" r="44" fill="#f3b27a"/>

  <!-- Газон -->
  <path d="M120 470q280-50 560 0v20H120z" fill="#7fb38a"/>

  <!-- Кущ (охайно підстрижений) -->
  <rect x="170" y="250" width="260" height="210" rx="40" fill="#4f8a5b"/>
  <g fill="#3f7350">
    <circle cx="260" cy="320" r="18"/>
    <circle cx="340" cy="290" r="14"/>
    <circle cx="400" cy="350" r="20"/>
    <circle cx="300" cy="400" r="16"/>
  </g>

  <!-- Садові ножиці -->
  <g transform="translate(560 330) rotate(-20) scale(1.35)">
    <path d="M-8 0L-120 -22l4-16L0 -10z" fill="#9aa5b1"/>
    <path d="M-8 0L-120 22l4 16L0 10z" fill="#c3ccd5"/>
    <circle cx="0" cy="0" r="10" fill="#1f3a5f"/>
    <rect x="6" y="-30" width="110" height="22" rx="11" fill="#e07a1f" transform="rotate(12)"/>
    <rect x="6" y="8" width="110" height="22" rx="11" fill="#e07a1f" transform="rotate(-12)"/>
  </g>

  <!-- Обрізане листя -->
  <g fill="#4f8a5b">
    <ellipse cx="480" cy="455" rx="12" ry="6" transform="rotate(-20 480 455)"/>
    <ellipse cx="505" cy="465" rx="10" ry="5" transform="rotate(25 505 465)"/>
  </g>
</svg>
