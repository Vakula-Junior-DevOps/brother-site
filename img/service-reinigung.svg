<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Ілюстрація «Treppenhausreinigung»: сходи, мітла, відро й іскорки чистоти -->
  <rect width="800" height="600" fill="#eaf0f6"/>
  <circle cx="400" cy="300" r="230" fill="#d6e1ec"/>

  <!-- Сходи -->
  <path d="M170 480V400h80v-60h80v-60h80v-60h80v260z" fill="#34507e"/>
  <path d="M170 400h80M250 340h80M330 280h80M410 220h80" stroke="#1b2d4f" stroke-width="8" stroke-linecap="round"/>
  <!-- Перила -->
  <path d="M190 360L470 180" stroke="#9aa5b1" stroke-width="8" stroke-linecap="round"/>

  <!-- Відро -->
  <path d="M520 380h110l-14 100h-82z" fill="#6ab023"/>
  <path d="M530 380q45-60 90 0" fill="none" stroke="#1b2d4f" stroke-width="6"/>
  <ellipse cx="575" cy="380" rx="55" ry="10" fill="#5b9bd5"/>

  <!-- Мітла -->
  <g transform="translate(620 480) rotate(-18)">
    <rect x="-6" y="-260" width="12" height="200" rx="6" fill="#1b2d4f"/>
    <path d="M-34 -64h68l14 64h-96z" fill="#b6dc8a"/>
    <path d="M-24 -40v34M-8 -40v38M8 -40v38M24 -40v34" stroke="#6ab023" stroke-width="4"/>
  </g>

  <!-- Іскорки -->
  <g fill="#ffffff">
    <path d="M270 210l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
    <path d="M520 190l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
  </g>
</svg>
